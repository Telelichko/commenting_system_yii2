memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
date.timezone = UTC

; Required extensions for Yii2
extension=pdo_mysql
extension=mbstring
extension=openssl
extension=curl
extension=zip
extension=intl
extension=redis