services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: yii2_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "33306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - yii2_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for WebSocket Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: yii2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yii2_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM for Yii2
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: yii2_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yii2_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: yii2_nginx
    restart: unless-stopped
    ports:
      - "8080:80"    # Frontend
      - "8081:81"    # Backend
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - yii2_network

  # Node.js WebSocket Server
  node:
    build:
      context: ../websocket-server      
      dockerfile: ../yii2-comments/docker/node/Dockerfile
    container_name: yii2_node
    restart: unless-stopped
    ports:
      - "${NODE_PORT:-3000}:3000"
    volumes:
      - ../websocket-server:/app:cached
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yii2_network

volumes:
  mysql_data:
  redis_data:

networks:
  yii2_network:
    driver: bridge